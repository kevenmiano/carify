services:
  mariadb:
    image: mariadb:11.4
    container_name: carify-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "350MB"
    networks:
      - carify-network

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: carify-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512MB"
    networks:
      - carify-network

  tempo:
    image: grafana/tempo:2.5.0
    container_name: carify-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4319:4317"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512MB"
    networks:
      - carify-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: carify-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512MB"
    networks:
      - carify-network

  loki:
    image: grafana/loki:2.9.0
    container_name: carify-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256MB"
    networks:
      - carify-network


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: carify-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics
    depends_on:
      - jaeger
      - tempo
      - loki
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512MB"
    networks:
      - carify-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: carify-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - tempo
      - prometheus
      - loki
      - otel-collector
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "256MB"
    networks:
      - carify-network

networks:
  carify-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  tempo_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
